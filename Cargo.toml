[package]
name = "openbao"
version = "1.0.2"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Secure, typed, async Rust SDK for OpenBao"
repository = "https://github.com/valkyoth/openbao-rust-crate"
homepage = "https://github.com/valkyoth/openbao-rust-crate"
documentation = "https://docs.rs/openbao"
readme = "README.md"
keywords = ["openbao", "vault", "secrets", "security"]
categories = ["api-bindings", "authentication", "cryptography"]
include = [
    "build.rs",
    "src/**",
    "tests/**",
    "examples/**",
    "docs/**",
    "release-notes/**",
    "scripts/**",
    "deploy/podman/compose.dev.yml",
    "deploy/podman/openbao.dev.env.example",
    "deploy/podman/openbao.hcl",
    ".github/CODEOWNERS",
    ".github/FUNDING.yml",
    ".github/ISSUE_TEMPLATE/**",
    ".github/PULL_REQUEST_TEMPLATE.md",
    ".github/dependabot.yml",
    ".github/workflows/**",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "deny.toml",
    "README.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "LICENSE-*",
]

[features]
default = [
    "approle",
    "cert-auth",
    "cubbyhole",
    "database",
    "identity",
    "jwt-auth",
    "kerberos-auth",
    "kubernetes-auth",
    "ldap-auth",
    "userpass",
    "token",
    "kv1",
    "kv2",
    "kubernetes",
    "ldap",
    "pki",
    "rabbitmq",
    "ssh",
    "totp",
    "transit",
    "sys",
    "rustls-tls",
]
approle = []
cert-auth = []
cubbyhole = []
database = []
identity = []
jwt-auth = []
kerberos-auth = []
kubernetes-auth = []
ldap-auth = []
radius-auth = []
# RADIUS uses the legacy MD5-based RADIUS authenticator. Keep support available
# for audited compatibility deployments, but require explicit acknowledgment.
radius-auth-acknowledged = []
userpass = []
token = []
kv1 = []
kv2 = []
kubernetes = []
ldap = []
pki = []
rabbitmq = []
ssh = []
totp = []
transit = []
transit-bytes = ["dep:base64-ng"]
transit-import = ["dep:aes-kw", "dep:base64-ng", "dep:openssl", "dep:rand"]
transit-import-acknowledged = []
sys = []
http2 = ["reqwest/http2"]
time = ["dep:time"]
tokio-helpers = ["dep:tokio"]
tracing = ["dep:tracing"]
tls12-acknowledged = []
allow-weak-jitter-fallback-acknowledged = []
# Production operator APIs for init/unseal/rekey/rotate and PKI root deletion.
# These endpoints can expose, mutate, or destroy root, unseal, recovery,
# certificate-authority, and encryption-key material. They are disabled by
# default and require operator-ops-acknowledged.
operator-ops = []
operator-ops-acknowledged = []
# Legacy Transit SHA-1 support. Disabled by default so new builds cannot select
# SHA-1 without an explicit Cargo feature review.
allow-sha1-acknowledged = []
# Default TLS backend. Keep this enabled unless a deployment has audited a
# different transport stack.
rustls-tls = ["reqwest/rustls"]
# Legacy compatibility only. Enabling this pulls the platform native TLS stack
# and may pull OpenSSL on some targets; audit before use in high-security builds.
native-tls = ["reqwest/native-tls"]
# Must be enabled together with native-tls to confirm the transport stack was audited.
native-tls-acknowledged = []
# Must be enabled to allow LDAP configs that disable LDAP TLS certificate
# verification. This is intended only for audited legacy development setups.
insecure-ldap-tls-acknowledged = []
# Test-only escape hatch for this crate's HTTP mock tests. Do not enable in
# applications; it permits sensitive requests over numeric loopback HTTP.
sensitive-http-test-only = []
# Must be enabled together with sensitive-http-test-only to confirm the
# loopback HTTP credential transport test escape hatch was audited.
sensitive-http-test-only-acknowledged = []

[dependencies]
aes-kw = { version = "0.3.1", default-features = false, features = ["zeroize"], optional = true }
base64-ng = { version = "1.0.8", default-features = false, features = ["alloc"], optional = true }
getrandom = "0.4.2"
rand = { version = "0.10.1", default-features = false, features = ["std", "thread_rng"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
openssl = { version = "0.10.80", optional = true }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
subtle = "2.6.1"
time = { version = "0.3.47", default-features = false, features = ["parsing"], optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["time"], optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }
zeroize = "1.8.2"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
