[package]
name = "openbao"
version = "0.7.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Secure, typed, async Rust SDK for OpenBao"
repository = "https://github.com/valkyoth/openbao-rust-crate"
homepage = "https://github.com/valkyoth/openbao-rust-crate"
documentation = "https://docs.rs/openbao"
readme = "README.md"
keywords = ["openbao", "vault", "secrets", "security"]
categories = ["api-bindings", "authentication", "cryptography"]
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "docs/**",
    "release-notes/**",
    "scripts/**",
    "deploy/podman/compose.dev.yml",
    "deploy/podman/openbao.dev.env.example",
    "deploy/podman/openbao.hcl",
    ".github/CODEOWNERS",
    ".github/FUNDING.yml",
    ".github/ISSUE_TEMPLATE/**",
    ".github/PULL_REQUEST_TEMPLATE.md",
    ".github/dependabot.yml",
    ".github/workflows/**",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "deny.toml",
    "README.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "LICENSE-*",
]

[features]
default = [
    "approle",
    "cert-auth",
    "cubbyhole",
    "database",
    "jwt-auth",
    "kubernetes-auth",
    "userpass",
    "token",
    "kv1",
    "kv2",
    "pki",
    "ssh",
    "totp",
    "transit",
    "sys",
    "rustls-tls",
]
approle = []
cert-auth = []
cubbyhole = []
database = []
jwt-auth = []
kubernetes-auth = []
userpass = []
token = []
kv1 = []
kv2 = []
pki = []
ssh = []
totp = []
transit = []
transit-bytes = ["dep:base64-ng"]
sys = []
# Production operator APIs for init/unseal/rekey/rotate. These endpoints can
# expose or mutate root, unseal, recovery, and encryption-key material. They
# are disabled by default and require operator-ops-acknowledged.
operator-ops = []
operator-ops-acknowledged = []
# Legacy Transit SHA-1 support. Disabled by default so new builds cannot select
# SHA-1 without an explicit Cargo feature review.
allow-sha1 = []
# Default TLS backend. Keep this enabled unless a deployment has audited a
# different transport stack.
rustls-tls = ["reqwest/rustls"]
# Legacy compatibility only. Enabling this pulls the platform native TLS stack
# and may pull OpenSSL on some targets; audit before use in high-security builds.
native-tls = ["reqwest/native-tls"]
# Must be enabled together with native-tls to confirm the transport stack was audited.
native-tls-acknowledged = []

[dependencies]
base64-ng = { version = "1.0.6", default-features = false, features = ["alloc"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
subtle = "2.6.1"
zeroize = "1.8.2"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
