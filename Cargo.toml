[package]
name = "openbao"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Secure, typed, async Rust SDK for OpenBao"
repository = "https://github.com/valkyoth/openbao-rust-crate"
homepage = "https://github.com/valkyoth/openbao-rust-crate"
documentation = "https://docs.rs/openbao"
readme = "README.md"
keywords = ["openbao", "vault", "secrets", "security"]
categories = ["api-bindings", "authentication", "cryptography"]
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "docs/**",
    "release-notes/**",
    "scripts/**",
    "deploy/podman/compose.dev.yml",
    "deploy/podman/openbao.dev.env.example",
    "deploy/podman/openbao.hcl",
    ".github/**",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "deny.toml",
    "README.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "LICENSE-*",
]

[features]
default = ["approle", "token", "kv1", "kv2", "sys", "rustls-tls"]
approle = []
token = []
kv1 = []
kv2 = []
sys = []
# Default TLS backend. Keep this enabled unless a deployment has audited a
# different transport stack.
rustls-tls = ["reqwest/rustls"]
# Legacy compatibility only. Enabling this pulls the platform native TLS stack
# and may pull OpenSSL on some targets; audit before use in high-security builds.
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zeroize = "1.8.2"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
