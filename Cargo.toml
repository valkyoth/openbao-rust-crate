[package]
name = "openbao"
version = "2.1.5"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Secure, typed, async Rust SDK for OpenBao"
repository = "https://github.com/valkyoth/openbao-rust-crate"
homepage = "https://github.com/valkyoth/openbao-rust-crate"
documentation = "https://docs.rs/openbao"
readme = "README.md"
keywords = ["openbao", "vault", "secrets", "security"]
categories = ["api-bindings", "authentication", "cryptography"]
include = [
    "/build.rs",
    "/src/**",
    "/examples/**",
    "/tests/package_smoke.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE-*",
]

[features]
default = [
    "approle",
    "cert-auth",
    "cubbyhole",
    "database",
    "identity",
    "jwt-auth",
    "kerberos-auth",
    "kubernetes-auth",
    "ldap-auth",
    "userpass",
    "token",
    "kv1",
    "kv2",
    "kubernetes",
    "ldap",
    "pki",
    "rabbitmq",
    "ssh",
    "totp",
    "transit",
    "sys",
    "rustls-tls",
]
approle = []
cert-auth = []
cubbyhole = []
database = []
identity = ["dep:base64-ng"]
jwt-auth = []
# OpenBao's JWT/OIDC callback and poll endpoints, plus Identity provider GET
# authorize, place credentials or correlation values in query strings.
oidc-get-callback-acknowledged = []
# OpenBao 2.6 identity-template delimiter overrides can turn trusted identity
# metadata into ACL paths, PKI names, or SSH principal lists with attacker-
# controlled separators. Typed send paths require this explicit review gate.
identity-template-overrides-acknowledged = []
kerberos-auth = []
kubernetes-auth = []
ldap-auth = []
radius-auth = []
# RADIUS uses the legacy MD5-based RADIUS authenticator. Keep support available
# for audited compatibility deployments, but require explicit acknowledgment.
radius-auth-acknowledged = []
userpass = []
token = []
kv1 = []
kv2 = []
kubernetes = []
ldap = []
pki = []
acme-protocol = ["pki"]
rabbitmq = []
ssh = []
totp = []
transit = []
transit-bytes = ["dep:base64-ng"]
transit-import = ["dep:aes-kw", "dep:base64-ng", "dep:openssl", "dep:rand"]
transit-import-acknowledged = []
sys = []
# Disposable loopback initialization can reach production through a local
# tunnel or proxy. Keep it outside default builds and require explicit review.
dev-bootstrap = ["sys"]
dev-bootstrap-acknowledged = []
workflow-trace = ["sys"]
workflow-trace-acknowledged = []
unauthenticated-workflows = ["sys"]
unauthenticated-workflows-acknowledged = []
monitor-stream = ["sys", "dep:bytes", "dep:futures-core", "reqwest/stream"]
raft-stream = ["sys", "dep:bytes", "dep:futures-core", "reqwest/stream"]
http2 = ["reqwest/http2"]
time = ["dep:time"]
tokio-helpers = ["dep:tokio"]
tracing = ["dep:tracing"]
# Stores the authenticated Client's retained token in sanitization locked
# mapped memory and exposes the mapped-memory types for explicit custody use.
memory-lock = ["sanitization/profile-hardened-native"]
memory-lock-acknowledged = []
kani = []
tls12-acknowledged = []
allow-weak-jitter-fallback-acknowledged = []
# Public raw JSON/byte transport can bypass typed endpoint validation and
# feature gates. Keep it disabled unless a deployment-specific wrapper has
# been reviewed and explicitly acknowledged.
raw-api = []
raw-api-acknowledged = []
# Production operator APIs for init/unseal/rekey/rotate, sealable namespace
# lifecycle, and PKI root deletion.
# These endpoints can expose, mutate, or destroy root, unseal, recovery,
# namespace, certificate-authority, and encryption-key material. They are
# disabled by default and require operator-ops-acknowledged.
operator-ops = ["dep:base64-ng"]
operator-ops-acknowledged = []
# Unstable OpenBao internal inspection/configuration endpoints. These have no
# compatibility guarantee and also require the operator-operation gates.
unstable-internal-ops = ["operator-ops"]
unstable-internal-ops-acknowledged = []
# Legacy Transit SHA-1 support. Disabled by default so new builds cannot select
# SHA-1 without an explicit Cargo feature review.
allow-sha1-acknowledged = []
# Default TLS backend. Keep this enabled unless a deployment has audited a
# different transport stack.
rustls-tls = ["reqwest/rustls"]
# Legacy compatibility only. Enabling this pulls the platform native TLS stack
# and may pull OpenSSL on some targets; audit before use in high-security builds.
native-tls = ["reqwest/native-tls"]
# Must be enabled together with native-tls to confirm the transport stack was audited.
native-tls-acknowledged = []
# Must be enabled to allow LDAP configs that disable LDAP TLS certificate
# verification. This is intended only for audited legacy development setups.
insecure-ldap-tls-acknowledged = []
# Must be enabled to allow reviewed built-in database configs that disable
# database-server TLS certificate verification.
insecure-database-tls-acknowledged = []
# Test-only escape hatch for this crate's HTTP mock tests. Do not enable in
# applications; it permits sensitive requests over numeric loopback HTTP.
sensitive-http-test-only = []
# Must be enabled together with sensitive-http-test-only to confirm the
# loopback HTTP credential transport test escape hatch was audited.
sensitive-http-test-only-acknowledged = []

[dependencies]
aes-kw = { version = "0.3.1", default-features = false, optional = true }
base64-ng = { version = "2.0.3", default-features = false, features = ["alloc"], optional = true }
bytes = { version = "1.12.1", optional = true }
futures-core = { version = "0.3.34", optional = true }
getrandom = "0.4.3"
rand = { version = "0.10.2", default-features = false, features = ["std", "thread_rng"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
openssl = { version = "0.10.81", optional = true }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
subtle = "2.6.1"
time = { version = "0.3.55", default-features = false, features = ["parsing"], optional = true }
tokio = { version = "1.53.1", default-features = false, features = ["time"], optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }
url = { version = "2.5.8", default-features = false }
sanitization = { version = "2.0.4", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
openssl = "0.10.81"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
