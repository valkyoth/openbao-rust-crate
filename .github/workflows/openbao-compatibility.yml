name: OpenBao Compatibility

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Select locked release matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Validate compatibility controller
        run: python3 -B scripts/openbao_ci_matrix.py self-test

      - name: Select matrix from immutable inventory
        id: plan
        env:
          OPENBAO_EVENT_NAME: ${{ github.event_name }}
        run: >-
          python3 -B scripts/openbao_ci_matrix.py plan
          --event "$OPENBAO_EVENT_NAME"
          --github-output "$GITHUB_OUTPUT"

  compatibility:
    name: OpenBao ${{ matrix.version }}
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Verify runner prerequisites
        run: |
          podman --version
          openssl version
          python3 --version

      - name: Install primary Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version

      - name: Run locked OpenBao core flow
        env:
          OPENBAO_MATRIX_VERSION: ${{ matrix.version }}
        run: >-
          python3 -B scripts/openbao_ci_matrix.py run
          --version "$OPENBAO_MATRIX_VERSION"

      - name: Upload sanitized release result
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openbao-core-${{ matrix.version }}
          path: ci-artifacts/openbao-result.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          include-hidden-files: false

  aggregate:
    name: Aggregate results
    needs:
      - plan
      - compatibility
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Download release results
        id: download
        continue-on-error: true
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: openbao-core-*
          path: ci-artifacts/downloaded
          merge-multiple: false

      - name: Aggregate and validate all expected results
        if: ${{ always() }}
        env:
          OPENBAO_MATRIX_PROFILE: ${{ needs.plan.outputs.profile }}
          OPENBAO_MATRIX_JOB_RESULT: ${{ needs.compatibility.result }}
          OPENBAO_DOWNLOAD_RESULT: ${{ steps.download.outcome }}
        run: >-
          python3 -B scripts/openbao_ci_matrix.py aggregate
          --profile "$OPENBAO_MATRIX_PROFILE"
          --matrix-job-result "$OPENBAO_MATRIX_JOB_RESULT"
          --download-result "$OPENBAO_DOWNLOAD_RESULT"

      - name: Upload aggregate compatibility report
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openbao-compatibility-report
          path: ci-artifacts/openbao-compatibility-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          include-hidden-files: false
