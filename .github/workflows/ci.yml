name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0

      - name: Install Rust toolchain
        shell: bash
        run: scripts/ci_install_rust.sh

      - name: Cache Rust build output
        # Swatinem/rust-cache v2.9.1
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc
        with:
          cache-on-failure: true

      - name: Install security tools
        # taiki-e/install-action v2.81.3
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09
        with:
          tool: cargo-deny@0.19.8,cargo-audit@0.22.1,cargo-sbom@0.10.0

      - name: Run checks
        run: scripts/checks.sh

      - name: Generate SBOM
        run: scripts/generate-sbom.sh
