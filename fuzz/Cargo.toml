[package]
name = "openbao-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
openbao = { path = "..", version = "=2.1.0", features = ["sys"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "path_validation"
path = "fuzz_targets/path_validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_error_decode"
path = "fuzz_targets/api_error_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_envelope"
path = "fuzz_targets/response_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "version_parsing"
path = "fuzz_targets/version_parsing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compatibility_profile"
path = "fuzz_targets/compatibility_profile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "versioned_response_envelope"
path = "fuzz_targets/versioned_response_envelope.rs"
test = false
doc = false
bench = false
