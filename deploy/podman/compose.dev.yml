name: ${OPENBAO_DEV_PROJECT:?Run scripts/openbao_dev.sh}

networks:
  openbao_internal:
    internal: true

volumes:
  openbao_data:

services:
  openbao:
    image: ${OPENBAO_IMAGE:?Run scripts/openbao_dev.sh}
    container_name: ${OPENBAO_DEV_PROJECT:?Run scripts/openbao_dev.sh}_dev
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    user: "100:0"
    environment:
      BAO_CACERT: /openbao/tls/dev-ca.crt
    volumes:
      - openbao_data:/openbao/data
      - ./openbao.hcl:/openbao/config/openbao.hcl:ro,Z
      - ./dev-state/${OPENBAO_DEV_VERSION:?Run scripts/openbao_dev.sh}/tls:/openbao/tls:ro,z
    ports:
      - "127.0.0.1:9940:8200"
      - "127.0.0.1:9941:8201"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=https://127.0.0.1:8200", "-ca-cert=/openbao/tls/dev-ca.crt"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges
    networks:
      - openbao_internal
    restart: unless-stopped
